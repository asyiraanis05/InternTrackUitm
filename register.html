
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | InternTrack UiTM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-bg">

<div class="container py-5">

    <div class="register-card mx-auto">

        <a href="index.html">← Back to Login</a>

        <h2 class="mt-3">Student Registration</h2>
        <p class="text-secondary">Create your student account.</p>

        <div id="registerAlert"></div>

        <form id="registerForm">

            <label class="form-label">Full Name</label>
            <input type="text" id="regName" class="form-control mb-3" required>

            <label class="form-label">Student ID</label>
            <input type="text" id="regId" class="form-control mb-3" required>

            <label class="form-label">Email</label>
            <input type="email" id="regEmail" class="form-control mb-3" required>

            <label class="form-label">Programme</label>
            <input type="text" id="regProgramme" class="form-control mb-3" required>

            <label class="form-label">Faculty</label>
            <input type="text" id="regFaculty" class="form-control mb-3" required>

            <label class="form-label">Campus</label>
            <input type="text" id="regCampus" class="form-control mb-3" required>

            <label class="form-label">Phone Number</label>
            <input type="text" id="regPhone" class="form-control mb-3">

            <label class="form-label">Password</label>
            <input type="password" id="regPassword" class="form-control mb-3" minlength="6" required>

            <button type="submit" class="btn btn-primary w-100">
                Create Account
            </button>

        </form>

    </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
