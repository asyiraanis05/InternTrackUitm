<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | InternTrack UiTM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg app-nav">
    <div class="container">
        <a class="navbar-brand" href="student.html">InternTrack UiTM</a>
        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#studentNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="studentNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="student.html">Dashboard</a>
                <a class="nav-link text-white" href="my-application.html">My Application</a>
                <a class="nav-link text-white" href="student-records.html">Placement Records</a>
                <a class="nav-link text-white" href="profile.html">My Profile</a>
                <button class="btn btn-sm btn-outline-light ms-lg-3" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4">
    <h3>My Profile</h3>
    <p class="text-secondary">Your registered student information.</p>

    <section class="panel-card mt-4">
        <div id="profileAlert"></div>
        <form id="profileForm">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="profileName" class="form-control" required>
                </div>

              

<div class="col-md-6">
    <label class="form-label">Student ID</label>
    <input type="text" id="profileStudentId" class="form-control" required>
</div>

<div class="col-md-6">
    <label class="form-label">Email Address</label>
    <input type="email" id="profileEmail" class="form-control" required>
</div>

<div class="col-md-6">
    <label class="form-label">Phone Number</label>
    <input type="text" id="profilePhone" class="form-control" required>
</div>


                <div class="col-md-6">
                    <label class="form-label">Programme</label>
                    <input type="text" id="profileProgramme" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Faculty</label>
                    <input type="text" id="profileFaculty" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Campus</label>
                    <input type="text" id="profileCampus" class="form-control" required>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </form>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
