<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Reports | InternTrack UiTM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg app-nav">
    <div class="container">
        <a class="navbar-brand" href="admin.html">InternTrack UiTM | Admin</a>
        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="admin.html">Dashboard</a>
                <a class="nav-link text-white" href="admin-applications.html">Applications</a>
                <a class="nav-link text-white" href="admin-reports.html">Reports</a>
                <button class="btn btn-sm btn-outline-light ms-lg-3" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4">
    <h3>Application Reports</h3>
    <p class="text-secondary">Overview of UiTM internship placement applications.</p>

    <div class="row g-3 mt-2">
        <div class="col-lg-6">
            <section class="panel-card">
                <h5>Application Status Summary</h5>
                <canvas id="statusChart"></canvas>
            </section>
        </div>

        <div class="col-lg-6">
            <section class="panel-card">
                <h5>Preferred Department Summary</h5>
                <canvas id="departmentChart"></canvas>
            </section>
        </div>
    </div>

    <section class="panel-card mt-4">
        <h5>Department Application Summary</h5>
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Department / Unit</th>
                        <th>Total Applications</th>
                    </tr>
                </thead>
                <tbody id="departmentSummaryTable">
                    <tr>
                        <td colspan="2" class="text-center text-secondary">No data available.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
